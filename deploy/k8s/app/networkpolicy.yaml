apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-access
  namespace: {{NAMESPACE}}
spec:
  podSelector:
    matchLabels:
      app: claude-code-hub
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 23000
