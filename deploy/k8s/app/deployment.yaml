apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-code-hub
  namespace: {{NAMESPACE}}
  labels:
    app: claude-code-hub
    app.kubernetes.io/part-of: claude-code-hub
spec:
  replicas: {{APP_REPLICAS}}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: claude-code-hub
  template:
    metadata:
      labels:
        app: claude-code-hub
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: {{APP_IMAGE}}
          imagePullPolicy: Always
          ports:
            - containerPort: 23000
              name: http
          envFrom:
            - configMapRef:
                name: claude-code-hub-config
          env:
            - name: CCH_DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: claude-code-hub-secrets
                  key: dsn
            - name: CCH_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: claude-code-hub-secrets
                  key: redis-url
            - name: CCH_AUTH_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: claude-code-hub-secrets
                  key: admin-token
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 23000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 23000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /health
              port: 23000
            initialDelaySeconds: 3
            periodSeconds: 3
            timeoutSeconds: 5
            failureThreshold: 10
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
