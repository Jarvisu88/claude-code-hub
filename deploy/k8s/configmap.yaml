apiVersion: v1
kind: ConfigMap
metadata:
  name: claude-code-hub-config
  namespace: {{NAMESPACE}}
  labels:
    app: claude-code-hub
    app.kubernetes.io/part-of: claude-code-hub
data:
  CCH_SERVER_PORT: "23000"
  CCH_SERVER_HOST: "0.0.0.0"
  CCH_SERVER_MODE: "release"
  CCH_AUTO_MIGRATE: "true"
  CCH_LOG_LEVEL: "info"
  CCH_LOG_FORMAT: "json"
  CCH_RATE_LIMIT_ENABLED: "true"
  CCH_PROXY_SESSION_TTL: "300"
  CCH_PROXY_MAX_RETRY_ATTEMPTS: "3"
  CCH_PROXY_MAX_PROVIDER_SWITCHES: "20"
  CCH_DATABASE_MAX_OPEN_CONNS: "25"
  CCH_DATABASE_MAX_IDLE_CONNS: "5"
  CCH_DATABASE_CONN_MAX_LIFETIME: "5m"
  TZ: "{{TIMEZONE}}"
