apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: claude-code-hub
  namespace: {{NAMESPACE}}
  annotations:
    # Streaming responses require long timeouts and disabled buffering (nginx-ingress)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    # Traefik annotation (when installed as Ingress Controller)
    traefik.ingress.kubernetes.io/router.middlewares: "{{NAMESPACE}}-streaming-headers@kubernetescrd"
spec:
  ingressClassName: "{{INGRESS_CLASS}}"
  tls:
    - hosts:
        - "{{INGRESS_HOST}}"
      secretName: claude-code-hub-tls
  rules:
    - host: "{{INGRESS_HOST}}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: claude-code-hub
                port:
                  number: 80
