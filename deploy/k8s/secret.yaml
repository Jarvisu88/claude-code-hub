# Secret template - fill in real values before applying.
# Generate base64 values: echo -n 'value' | base64
apiVersion: v1
kind: Secret
metadata:
  name: claude-code-hub-secrets
  namespace: {{NAMESPACE}}
  labels:
    app: claude-code-hub
    app.kubernetes.io/part-of: claude-code-hub
type: Opaque
data:
  # echo -n 'postgres://claude_code_hub:<password>@postgres:5432/claude_code_hub?sslmode=disable' | base64
  dsn: "REPLACE_WITH_BASE64_ENCODED_DSN"
  # echo -n 'redis://:password@redis:6379/0' | base64
  redis-url: "REPLACE_WITH_BASE64_ENCODED_REDIS_URL"
  # echo -n 'your-admin-token' | base64
  admin-token: "REPLACE_WITH_BASE64_ENCODED_ADMIN_TOKEN"
  # echo -n 'your-pg-password' | base64
  pg-password: "REPLACE_WITH_BASE64_ENCODED_PG_PASSWORD"
  # echo -n 'your-redis-password' | base64
  redis-password: "REPLACE_WITH_BASE64_ENCODED_REDIS_PASSWORD"
